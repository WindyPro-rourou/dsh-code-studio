name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both OS families on purpose: the portable (随盘) workspace policy is anchored on
    # Windows drive letters, so the suite must prove it degrades honestly on POSIX
    # instead of quietly passing everywhere. fail-fast off so each cell reports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Host selftest
        run: node scripts/selftest.mjs
      - name: Client smoke
        run: node scripts/smoke-client.mjs
      # diff correctness: trimming the common head/tail must not move the reported
      # adds/dels counts (it may only pick a different equally-minimal alignment)
      - name: Diff engine property test
        run: node scripts/difftest.mjs 1500
      # deterministic render-cost guard: a re-render must not re-diff the change set
      - name: Panel render cost
        run: node scripts/perf-panel.mjs 60 120 local
      # the windowed diff must render the same tree as the previous full-materialization
      # implementation, in both layouts and at several scroll positions
      - name: Diff view render equivalence
        run: node scripts/render-equivalence.mjs
      # the editor must window its gutter/highlight layers and keep the scroll height exact
      - name: Editor window geometry
        run: node scripts/editor-window.mjs
      # created-file baseline, tab-stealing on agent edits, redundant connection notifications
      - name: Change feed behaviour
        run: node scripts/feed-behavior.mjs
      # where the inline word-diff marks land (the render test cannot see placement)
      - name: Word diff placement
        run: node scripts/worddiff-test.mjs
      # tokenizer, localStorage snapshot policy, Escape precedence, shortcut scoping
      - name: Client units
        run: node scripts/client-units.mjs
